<html>
    <head></head>
    <body class="container-fluid">
    <div class="row">
        <div class="col-sm-2">
            <div class="name" style="border-bottom: 1px solid white;">
                <div style="font-size: 30px;text-align: center;">Player Name</div>
                <input id="name" class="form-control form-control-sm w-100" type="text" style="border: none;background-color: transparent;" placeholder="Name and Team">
                <div style="text-align: right;">
                    <button id="play_button" class="btn btn-sm btn-outline-secondary w-100" style="display: none;" onclick="play_now(); bg_sound.play()">Play</button>
                </div>
            </div>
            <div>
                <div style="text-align: center;font-size: 40px;">Score</div>
                <div id="score"></div>
            </div>
            <div class="card bg-transparent" style="border: none;">
                <div style="text-align: center;font-size: 30px;">High Scores</div>
                <table id = "scoreboard" style="font-size: 30px; text-align: center; margin-left: auto; margin-right: auto;"></table>
                <div>
                    <button class="btn btn-sm btn-outline-secondary w-100" onclick="reset_scores()">Reset</button>
                </div>
            </div>
        </div>
        <div class="col-sm-8">
            <div id="banner">Crossy Road</div>
            <div id="game-wrapper">
                <canvas id="game_canvas"></canvas>
                <img id = "lose-gif" alt="explode"></img>
            </div>
        </div>
        <div class="col-sm-2">
            <div class="card bg-transparent" style="border: none;">
                <div style="text-align: center;font-size: 30px;">Combo</div>
                <div id="combo"></div>
                <div id= "combotmr"></div>
            </div>
        </div>
    </div>
    </body>

    <link rel="stylesheet" href="dist/font-awesome/css/all.css" type="text/css">
    <link href="dist/bootstrap-5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="dist/bootstrap-5.1.3/js/bootstrap.min.js"></script>
    <script src="dist/bootstrap-5.1.3/popper.js"></script>

    <script src="dist/jquery-3.6.0.min.js"></script>

    <script src="js/main.js"></script>
    <script src="js/topscores.js"></script>
    <link rel="stylesheet" type="text/css" href="css/main.css" />
</html>
